# Deploy gating trade-off: GitHub Actions cannot combine `workflow_run` (depend on
# ci.yml) with per-workflow path filters, so the "gate" job below is a fast test
# prerequisite inside this workflow to keep path-filter triggers; full CI still runs
# in parallel in ci.yml. The gate runs protocol truth, and the candidate build
# runs the real browser suite before any Pages artifact or Cloudflare publish.
name: Deploy Pages

on:
  workflow_dispatch:
    inputs:
      candidate_revision:
        description: "Exact 40-character candidate SHA already verified on stable staging"
        required: true
        type: string
      staging_artifact_digest:
        description: "Exact 64-character SHA-256 artifact digest verified on stable staging"
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "package.json"
      - "public/**"
      - "scripts/build-pages.mjs"
      - "scripts/check-browser-module-reachability.mjs"
      - "scripts/responsive-evidence.mjs"
      - "src/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    # Expanded S118 shards include the inherited policy/identity regressions.
    # Keep every assertion; the expanded contract leg has a measured larger
    # finite budget, while the other legs retain their 90-minute bound.
    # `build` still requires all four parallel legs.
    timeout-minutes: ${{ matrix.shard == 'sim contract' && 160 || 100 }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - shard: studio (protocol truth)
            command: npm run test:studio
          - shard: core (engine + domain behavior)
            command: npm run test:core
          - shard: sim contract
            command: npm run test:sim:contract
          - shard: sim realism
            command: npm run test:sim:realism
    name: gate (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_revision || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.0" # pinned: Node 24.16 hangs playwright install post-download (S14 evidence: runs 26991314776, 26991314875)
          cache: npm

      - name: Install dependencies
        run: npm ci

      # S101: this gate ran the studio shard alone while `src/**` is a trigger
      # path for this workflow, so an engine or economy regression could reach
      # playfranchisearchitect.com with nothing on the publish path having
      # exercised it -- full CI runs in parallel and is not a `needs:` of this
      # job. These are the behavior shards covering `src/**`; `long` stays out
      # here to avoid repeating the separately required candidate CI long leg.
      - name: Run ${{ matrix.shard }} shard
        run: ${{ matrix.command }}

  build:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    env:
      PLAYWRIGHT_CHANNEL: chrome
      # S70: pre-rebrand values shipped legacy vaultspark-football-gm canonicals
      # on playfranchisearchitect.com for every deploy since S25. Root mount +
      # canonical brand host; legacy mounts remain published as mirrors.
      VITE_APP_BASE_PATH: /
      VITE_CANONICAL_URL: https://playfranchisearchitect.com/
      VITE_OG_IMAGE_URL: https://playfranchisearchitect.com/images/cover.png
      VITE_DOMAIN: playfranchisearchitect.com
      VITE_API_ORIGIN: ${{ vars.API_ORIGIN }}
      VITE_GAME_SERVICE_ORIGIN: ${{ vars.GAME_SERVICE_ORIGIN }}
      API_ORIGIN: ${{ vars.API_ORIGIN }}
      API_DOMAIN: ${{ vars.API_DOMAIN }}
      VSFGM_RUNTIME_DEFAULT: client
      SOURCE_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_revision || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_revision || github.sha }}
          # build-pages derives sitemap lastmod from per-file git history.
          # A shallow checkout makes every route look newly changed and changes
          # the artifact digest relative to the exact same staging candidate.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.0" # pinned: Node 24.16 hangs playwright install post-download (S14 evidence: runs 26991314776, 26991314875)
          cache: npm

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0, Node 24

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build Pages bundle
        run: npm run build:pages

      # Use the supported Chrome channel supplied by the hosted runner image.
      - name: Verify installed browser
        run: google-chrome --version

      - name: Smoke static Pages client
        timeout-minutes: 5
        run: npm run smoke:pages

      - name: Run browser release gate
        # Same complete suite and finite budget as the candidate CI job.
        timeout-minutes: 180
        run: npm run test:ui

      - name: Capture responsive artifact evidence
        timeout-minutes: 8
        run: npm run evidence:responsive

      - name: Upload responsive evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1, Node 24
        with:
          name: responsive-evidence-${{ github.sha }}
          path: output/playwright/responsive-*/
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: static

      - name: Bind production promotion to the exact staged candidate
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
          STAGING_ARTIFACT_DIGEST: ${{ inputs.staging_artifact_digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_REVISION" =~ ^[a-f0-9]{40}$ ]]
          [[ "$STAGING_ARTIFACT_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_REVISION"
          node scripts/verify-promotion-bind.mjs --manifest static/deploy-manifest.json --staging-url https://staging.playfranchisearchitect.com

      - name: Verify stable staging serves the exact promotion candidate
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/verify-staging-receipt.mjs --expected static/deploy-manifest.json --base-url https://staging.playfranchisearchitect.com

      # ── Live origin (S65) ──────────────────────────────────────────────────
      # playfranchisearchitect.com is a CNAME to franchise-architect-football
      # .pages.dev — a *Cloudflare* Pages project — while everything above
      # publishes to *GitHub* Pages. That project had no git connection and only
      # two ad-hoc manual uploads (2026-07-01 and 2026-07-03), so the live domain
      # served a month-old build: /_health, /sw.js, /deploy-manifest.json and
      # /edge-policy-receipt.json all 404'd simply because they were added after
      # 2026-07-03, and the generated _headers file was never applied because
      # GitHub Pages ignores it.
      #
      # Publishing the *same* `static/` directory that was just uploaded above
      # keeps both origins byte-identical, and --commit-hash stamps the real
      # revision into the health receipt instead of "local-worktree".
      - name: Require complete exact-candidate CI before production publication
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
        run: node scripts/wait-for-candidate-ci.mjs --repository "$GITHUB_REPOSITORY" --sha "$CANDIDATE_REVISION" --max-wait-minutes 90

      - name: Publish to Cloudflare Pages (live origin)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.80.0 pages deploy static             --project-name=franchise-architect-football             --branch=main             --commit-hash="${{ inputs.candidate_revision }}"

      - name: Verify the live origin serves this build
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/verify-live-origin.mjs

  deploy:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
