# Deploy gating trade-off: GitHub Actions cannot combine `workflow_run` (depend on
# ci.yml) with per-workflow path filters, so the "gate" job below is a fast test
# prerequisite inside this workflow to keep path-filter triggers; full CI still runs
# in parallel in ci.yml. The gate runs both protocol-truth and backend runtime
# shards so a push that breaks either cannot build/push GHCR images. The manual-dispatch deploy-server
# job depends on build-images, so it transitively depends on the gate too.
name: Deploy Backend Runtime

on:
  workflow_dispatch:
    inputs:
      deploy_to_server:
        description: "Also deploy the latest images to the configured backend host"
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-backend.yml"
      - "Dockerfile.runtime"
      - "package.json"
      - "package-lock.json"
      - "ops/**"
      - "public/**"
      - "scripts/deploy-backend-ssh.mjs"
      - "src/**"

permissions:
  contents: read
  packages: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.0" # pinned: Node 24.16 hangs playwright install post-download (S14 evidence: runs 26991314776, 26991314875)
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run studio shard (protocol truth)
        run: npm run test:studio

      - name: Run runtime shard (backend behavior)
        run: npm run test:runtime

      # S101: see deploy-pages.yml -- the backend publish path also accepted
      # `src/**` changes with no engine-behavior shard between the push and
      # the deployed runtime.
      - name: Run core shard (engine + domain behavior)
        run: npm run test:core

      - name: Run sim contract shard
        run: npm run test:sim:contract

      - name: Run sim realism shard
        run: npm run test:sim:realism

  build-images:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        service:
          - play
          - api
    env:
      GAME_SLUG: franchise-architect-football
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Normalize image owner
        id: image-owner
        shell: bash
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.runtime
          push: true
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.image-owner.outputs.value }}/${{ env.GAME_SLUG }}-${{ matrix.service }}:latest
            ghcr.io/${{ steps.image-owner.outputs.value }}/${{ env.GAME_SLUG }}-${{ matrix.service }}:${{ github.sha }}

  deploy-server:
    needs: build-images
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_to_server }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"

      - name: Copy ops and deploy backend with bounded pinned SSH
        run: node scripts/deploy-backend-ssh.mjs
        env:
          BACKEND_SSH_HOST: ${{ secrets.BACKEND_SSH_HOST }}
          BACKEND_SSH_USER: ${{ secrets.BACKEND_SSH_USER }}
          BACKEND_SSH_KEY: ${{ secrets.BACKEND_SSH_KEY }}
          # Full known_hosts line: <BACKEND_SSH_HOST> ssh-ed25519 <base64 public host key>.
          # Provision from an authenticated host inventory, never from ssh-keyscan during deploy.
          BACKEND_SSH_HOST_KEY: ${{ secrets.BACKEND_SSH_HOST_KEY }}
          BACKEND_DEPLOY_PATH: ${{ secrets.BACKEND_DEPLOY_PATH }}
          DEPLOY_SHA: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
