name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit-shards:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.shard == 'sim:contract' && 160 || 100 }}
    strategy:
      fail-fast: false
      matrix:
        shard: [core, runtime, sim:contract, sim:realism, long, studio]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.14.0" # pinned: Node 24.16 hangs playwright install post-download (S14 evidence: runs 26991314776, 26991314875)
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.shard }} shard
        run: npm run test:${{ matrix.shard }}

  # The browser suite runs with one Playwright worker because the dev server
  # holds a single global game session, so one job ran every spec in sequence
  # (about 1.7 hours). Four jobs each start their own server and run a quarter
  # of the specs; every spec still runs exactly once and the worker count is
  # unchanged. `browser-gates` below is the single name that requires them all.
  browser-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      PLAYWRIGHT_CHANNEL: chrome

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.14.0" # pinned: Node 24.16 hangs playwright install post-download (S14 evidence: runs 26991314776, 26991314875)
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Use the supported Chrome channel supplied by the hosted runner image.
      - name: Verify installed browser
        run: google-chrome --version

      - name: Verify Pages build
        run: npm run build:pages
        env:
          # S70: CI verifies the same root-mount artifact the deploy publishes.
          VITE_APP_BASE_PATH: /
          VSFGM_RUNTIME_DEFAULT: client

      - name: Smoke static Pages client
        timeout-minutes: 5
        run: npm run smoke:pages

      - name: Run UI tests
        # The complete single-worker suite exceeded one hour on the S118 host.
        # Each quarter keeps a finite budget well above its expected ~25-30 min.
        timeout-minutes: 75
        run: npm run test:ui -- --shard=${{ matrix.shard }}/4

  # Keeps the job name the release contract waits on. It runs even when a shard
  # failed or was cancelled, and succeeds only if all four shards succeeded.
  browser-gates:
    needs: browser-shards
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every browser shard
        env:
          BROWSER_SHARDS_RESULT: ${{ needs.browser-shards.result }}
        run: |
          echo "browser-shards: $BROWSER_SHARDS_RESULT"
          test "$BROWSER_SHARDS_RESULT" = "success"
