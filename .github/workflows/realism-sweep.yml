name: Realism Sweep

# Deep statistical confidence sweep with its own time budget.
# Never wired into the push-blocking path — scheduled + manual only.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC

jobs:
  deep-realism:
    runs-on: ubuntu-latest
    # 20m long smoke + 90m sweep + setup/upload headroom. The job budget must be
    # larger than its bounded child steps or the outer timer can erase evidence.
    timeout-minutes: 125

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24.14.0" # pinned: Node 24.16 hangs playwright install post-download (S14 evidence: runs 26991314776, 26991314875)
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Long smoke shard (determinism + career realism)
        timeout-minutes: 20
        run: npm run test:long

      - name: Deep realism verification (24-season sample)
        timeout-minutes: 90
        shell: bash
        run: |
          set -o pipefail
          mkdir -p output
          printf 'started_at=%s\nseasons=24\nstatus=running\n' "$(date -u +%FT%TZ)" > realism-sweep-progress.txt
          if node src/data/scripts/verifyRealism.js --seasons 24 2>&1 | tee realism-sweep-report.txt; then
            printf 'finished_at=%s\nstatus=completed\n' "$(date -u +%FT%TZ)" >> realism-sweep-progress.txt
          else
            status=$?
            printf 'finished_at=%s\nstatus=failed\nexit_code=%s\n' "$(date -u +%FT%TZ)" "$status" >> realism-sweep-progress.txt
            exit "$status"
          fi

      - name: Upload sweep report and partial progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realism-sweep-report
          path: |
            realism-sweep-report.txt
            realism-sweep-progress.txt
            output/realism-verification.json
          if-no-files-found: warn
