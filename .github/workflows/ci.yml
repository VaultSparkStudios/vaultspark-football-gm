name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit-shards:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.shard == 'sim:contract' && 160 || 100 }}
    strategy:
      fail-fast: false
      matrix:
        shard: [core, runtime, sim:contract, sim:realism, long, studio]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24.14.0" # pinned: Node 24.16 hangs playwright install post-download (S14 evidence: runs 26991314776, 26991314875)
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.shard }} shard
        run: npm run test:${{ matrix.shard }}

  browser-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 205
    env:
      PLAYWRIGHT_CHANNEL: chrome

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24.14.0" # pinned: Node 24.16 hangs playwright install post-download (S14 evidence: runs 26991314776, 26991314875)
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Use the supported Chrome channel supplied by the hosted runner image.
      - name: Verify installed browser
        run: google-chrome --version

      - name: Verify Pages build
        run: npm run build:pages
        env:
          # S70: CI verifies the same root-mount artifact the deploy publishes.
          VITE_APP_BASE_PATH: /
          VSFGM_RUNTIME_DEFAULT: client

      - name: Smoke static Pages client
        timeout-minutes: 5
        run: npm run smoke:pages

      - name: Run UI tests
        # The complete single-worker suite exceeded one hour on the S118 host.
        # Preserve every case and leave a finite three-hour execution budget.
        timeout-minutes: 180
        run: npm run test:ui
